[project]
name = "candlefree"
version = "0.1.0"
description = "CandleFree — autonomous load shedding life-manager agent for South Africa (Strands Agents SDK)"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2.0",
    "botocore[crt]>=1.35.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
